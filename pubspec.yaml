name: mobiwha
description: "WhatsApp unsaved contact & message collector for business inquiries"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Notification Listener (real-time WhatsApp capture)
  flutter_notification_listener: ^1.4.0

  # Local SQLite database
  sqflite: ^2.3.3
  path: ^1.9.0

  # File system access
  path_provider: ^2.1.3

  # Runtime permissions
  permission_handler: ^11.3.1

  # Device contacts
  flutter_contacts: ^1.1.9+1

  # Date formatting
  intl: ^0.19.0

  # CSV export
  csv: ^6.0.0

  # Share files
  share_plus: ^9.0.0

  # UI Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
