<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
.bg{position:relative;width:1024px;height:500px;background:linear-gradient(135deg,#00C896 0%,#00A884 45%,#007A63 100%);color:#fff;display:flex;align-items:center;padding:0 70px;box-sizing:border-box;gap:48px}
.bg:before{content:'';position:absolute;right:-120px;top:-140px;width:520px;height:520px;border-radius:50%;background:rgba(255,255,255,.08)}
.bg:after{content:'';position:absolute;right:120px;bottom:-200px;width:380px;height:380px;border-radius:50%;background:rgba(139,92,246,.25)}
img{width:170px;height:170px;border-radius:40px;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative;z-index:1}
.t{position:relative;z-index:1}
h1{font-size:64px;margin:0 0 6px;font-weight:800;letter-spacing:-1px}
p{font-size:30px;margin:0 0 22px;opacity:.95;font-weight:600}
.chips{display:flex;gap:12px}
.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 18px;font-size:20px;font-weight:600}
</style></head><body><div class="bg">
<img src="../branding/out/logo-1024.png"><div class="t"><h1>MobiWA</h1>
<p>Turn WhatsApp chats into customers</p>
<div class="chips"><span class="chip">Get numbers</span><span class="chip">AI sort</span><span class="chip">Auto send</span></div></div>
</div></body></html>
